[project]
name = "ai-pulse"
version = "0.1.0"
description = "Daily AI news digest with per-project impact analysis"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "celery[redis]>=5.4",
    "fastapi>=0.115",
    "feedparser>=6.0",
    "flower>=2.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "openai>=1.50",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8.3", "respx>=0.21", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pulse"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
